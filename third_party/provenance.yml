version: 1

# Research-only repositories are documented under docs/research and are not
# listed here. Runtime dependencies and evidence-producing development tools
# are recorded; development-only tools are explicitly marked as not distributed.
components:
  - name: keyring
    source_url: https://pypi.org/project/keyring/
    commit_or_version: 25.7.0
    paths_imported: Python runtime dependency via uv.lock
    purpose: Store write-only provider API keys in the operating-system credential vault
    alternatives_considered: Platform-specific Windows Credential Manager and macOS Keychain adapters
    spdx_license: MIT
    license_file: keyring distribution metadata LICENSE
    notice_required: false
    modifications: none
    reviewed_by: Codex
    reviewed_at: 2026-08-04
  - name: playwright-core
    source_url: https://github.com/microsoft/playwright
    commit_or_version: 1.62.1
    paths_imported: Development-only Electron and Edge Chromium evidence dependency via pnpm-lock.yaml
    purpose: Run real Electron IPC and responsive Chromium evidence checks
    alternatives_considered: WebdriverIO and separate full Playwright package
    spdx_license: Apache-2.0
    license_file: playwright-core package LICENSE
    notice_required: false
    modifications: none; development-only and not distributed
    reviewed_by: Codex
    reviewed_at: 2026-08-04
  - name: FFmpeg and ffprobe development toolchain
    source_url: https://www.gyan.dev/ffmpeg/builds/
    commit_or_version: 8.1.2-full_build-www.gyan.dev
    paths_imported: No binary imported; exact external executable hashes are recorded in config/media-toolchain-lock.json
    purpose: Generate and probe synthetic Phase 0 media fixtures and CFR proxies
    alternatives_considered: Self-built LGPL-only FFmpeg and BtbN LGPL builds; release toolchain remains pending legal and reproducible-build review
    spdx_license: GPL-3.0-or-later
    license_file: External build reports --enable-gpl --enable-version3; FFmpeg legal terms at https://ffmpeg.org/legal.html
    notice_required: false
    modifications: none; development-only and explicitly prohibited from release distribution
    reviewed_by: Codex
    reviewed_at: 2026-08-04

