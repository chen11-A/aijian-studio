[project]
name = "aijian-studio-api"
version = "0.1.0"
description = "Aijian Studio local and server API"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.141.1,<0.142.0",
  "pydantic>=2.13.4,<3.0.0",
  "uvicorn[standard]>=0.52.1,<0.53.0",
]

[dependency-groups]
dev = [
  "httpx2>=2.9.1,<3.0.0",
  "mypy>=2.3.0,<2.4.0",
  "pytest>=9.1.1,<10.0.0",
  "pytest-cov>=7.1.0,<8.0.0",
  "ruff>=0.16.1,<0.17.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers"
testpaths = ["services/api/tests"]
pythonpath = ["services/api/src", "."]

[tool.coverage.run]
branch = true
source = ["aijian_api"]

[tool.coverage.report]
fail_under = 90
show_missing = true

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "services/api/src"
packages = ["aijian_api"]
