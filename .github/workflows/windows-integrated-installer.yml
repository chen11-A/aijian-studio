name: Windows integrated installer

on:
  pull_request:
    branches: [codex/aivora-handoff-20261012]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-integrated-installer-${{ github.ref }}
  cancel-in-progress: true

jobs:
  integrated-desktop:
    if: github.repository == 'chen11-A/aijian-studio'
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: "24.19.0"
          package-manager-cache: false
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12"
      - name: Set up uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: false
      - name: Verify and prepare fixed Windows tool inputs
        shell: pwsh
        run: |
          python packaging/windows/prepare-dev-core.py --cache "$env:RUNNER_TEMP\aivora-tool-cache" --tools "$env:RUNNER_TEMP\aivora-tools"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Restore locked JavaScript dependencies without lifecycle scripts
        shell: pwsh
        run: |
          npm ci --prefix packaging/windows/build-toolchain --ignore-scripts --no-audit --no-fund
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node packaging/windows/build-toolchain/node_modules/pnpm/bin/pnpm.cjs install --frozen-lockfile --ignore-scripts
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Freeze the Windows sidecar
        shell: pwsh
        run: |
          $python = "$env:RUNNER_TEMP\aivora-tools\cpython\python\python.exe"
          & $python packaging/windows/freeze-sidecar.py --development-core --cache "$env:RUNNER_TEMP\aivora-tool-cache" --output "$env:RUNNER_TEMP\aivora-frozen"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $python packaging/windows/smoke-frozen-sidecar.py --resources "$env:RUNNER_TEMP\aivora-frozen\resources"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build the media-free core, then add the locked FFmpeg pair
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force "$env:RUNNER_TEMP\aivora-evidence" | Out-Null
          python packaging/windows/package-dev-core.py --tools "$env:RUNNER_TEMP\aivora-tools" --frozen "$env:RUNNER_TEMP\aivora-frozen" --out "$env:RUNNER_TEMP\aivora-stage" --evidence "$env:RUNNER_TEMP\aivora-evidence"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $media = uv run --frozen python scripts/ci_media_tools.py --root "$env:RUNNER_TEMP\aivora-ffmpeg" | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python packaging/windows/bundle-locked-media.py --stage "$env:RUNNER_TEMP\aivora-stage" --tools "$env:RUNNER_TEMP\aivora-tools" --media $media.root --evidence "$env:RUNNER_TEMP\aivora-evidence"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Join two real shots with the bundled ffmpeg
        shell: pwsh
        run: |
          $env:AIVORA_FFMPEG = "$env:RUNNER_TEMP\aivora-stage\installer-output\win-unpacked\resources\media\ffmpeg.exe"
          $env:AIVORA_FFPROBE = "$env:RUNNER_TEMP\aivora-stage\installer-output\win-unpacked\resources\media\ffprobe.exe"
          if (-not (Test-Path $env:AIVORA_FFMPEG)) { throw "bundled ffmpeg is missing at $env:AIVORA_FFMPEG" }
          node packaging/windows/build-toolchain/node_modules/pnpm/bin/pnpm.cjs --filter @aijian/desktop exec vitest run src/film-library-ffmpeg.test.ts
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Compose a Chinese subtitle with the bundled font
        shell: pwsh
        run: |
          uv run --frozen python packaging/windows/smoke-subtitle-compose.py --stage "$env:RUNNER_TEMP\aivora-stage"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Install without admin into the current user
        shell: pwsh
        run: |
          $installer = Get-ChildItem "$env:RUNNER_TEMP\aivora-stage\installer-output\AIVORA-Setup-*-win-x64.exe" | Select-Object -First 1
          if (-not $installer) { throw "installer exe is missing" }
          $installed = Join-Path $env:LOCALAPPDATA "Programs\AIVORA\AIVORA.exe"
          $uninstaller = Join-Path $env:LOCALAPPDATA "Programs\AIVORA\Uninstall.exe"
          if (Test-Path $installed) { throw "a per-user install is already present" }
          $task = "AivoraPerUserInstall"
          schtasks /Create /TN $task /TR "`"$($installer.FullName)`" /S" /SC ONCE /ST 00:00 /RL LIMITED /F
          if ($LASTEXITCODE -ne 0) { throw "could not schedule an unelevated install" }
          schtasks /Run /TN $task
          if ($LASTEXITCODE -ne 0) { throw "could not start the unelevated install" }
          $deadline = (Get-Date).AddMinutes(3)
          do {
            Start-Sleep -Seconds 2
            if (Test-Path $installed) { break }
          } while ((Get-Date) -lt $deadline)
          if (-not (Test-Path $installed)) { throw "unelevated install did not land under LOCALAPPDATA" }
          $hkcu = Get-ItemProperty "HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\AIVORA" -ErrorAction SilentlyContinue
          if (-not $hkcu -or -not $hkcu.InstallLocation) { throw "HKCU uninstall key was not written" }
          if ($hkcu.InstallLocation -notlike "$env:LOCALAPPDATA*") { throw "install dir is not under LOCALAPPDATA: $($hkcu.InstallLocation)" }
          if (Test-Path "HKLM:\Software\Microsoft\Windows\CurrentVersion\Uninstall\AIVORA") { throw "installer wrote HKLM" }
          if (Test-Path $uninstaller) { & $uninstaller /S }
          schtasks /Delete /TN $task /F | Out-Null
      - name: Silent install, health check, screenshot, and uninstall
        shell: pwsh
        run: |
          python packaging/windows/smoke-integrated-install.py --stage "$env:RUNNER_TEMP\aivora-stage" --evidence "$env:RUNNER_TEMP\aivora-evidence" --delivery "$env:RUNNER_TEMP\aivora-delivery"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Upload unsigned integrated installer
        uses: actions/upload-artifact@v7
        with:
          name: AIVORA-Setup-win-x64
          path: ${{ runner.temp }}/aivora-delivery/*
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
