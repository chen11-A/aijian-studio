name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    name: quality (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # Linux host stays Ubuntu; Debian supplies the exact existing dev-tool pin.
    # This is a test container, not an additional supported product platform.
    container: ${{ matrix.container }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            container: python:3.12.15-slim-trixie
          - os: windows-latest
            container: null

    steps:
      - name: Prepare Debian test container and pinned development media tools
        if: runner.os == 'Linux'
        run: |
          apt-get update
          apt-get install -y --no-install-recommends git ca-certificates curl libstdc++6 ffmpeg=7:7.1.5-0+deb13u1 fonts-noto-cjk

      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Bind container Git trust to this workspace only
        if: runner.os == 'Linux'
        run: |
          test "$(git -c safe.directory="$GITHUB_WORKSPACE" rev-parse --show-toplevel)" = "$GITHUB_WORKSPACE"
          test -z "${GIT_CONFIG_COUNT:-}"
          echo "GIT_CONFIG_COUNT=1" >> "$GITHUB_ENV"
          echo "GIT_CONFIG_KEY_0=safe.directory" >> "$GITHUB_ENV"
          echo "GIT_CONFIG_VALUE_0=$GITHUB_WORKSPACE" >> "$GITHUB_ENV"

      - name: Set up Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: 24.15.0
          # The zero-extra-cost development branch must not write shared caches.
          package-manager-cache: ${{ github.ref != 'refs/heads/codex/windows-installer-dev-20261008' }}

      - name: Enable pinned pnpm
        run: corepack enable pnpm

      - name: Set up Python
        if: runner.os == 'Windows'
        uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: ${{ github.ref != 'refs/heads/codex/windows-installer-dev-20261008' }}

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Python dependencies
        run: uv sync --frozen --python 3.12

      - name: Verify exact Linux development media binaries
        if: runner.os == 'Linux'
        run: uv run python scripts/ci_media_tools.py --verify-only --root /usr/bin

      - name: Prepare exact Windows development media binaries
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $prepared = uv run python scripts/ci_media_tools.py --root "${{ runner.temp }}/aivora-quality-media"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Write-Output $prepared
          ($prepared | ConvertFrom-Json).root | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Verify generated contracts
        run: pnpm contracts:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Verify CI test diagnostics
        run: node scripts/ci-test-diagnostics.mjs --self-test

      - name: Test
        run: pnpm test:ci

      - name: Fault injection
        run: >-
          uv run pytest
          services/api/tests/test_fault_injection.py
          services/api/tests/test_fake_provider.py
          services/api/tests/test_fake_provider_worker.py
          services/api/tests/test_local_executor.py
          services/api/tests/test_task_ledger_recovery.py

      - name: Reproduce fault-injection evidence
        run: uv run python scripts/fault_injection_evidence.py verify

      - name: Reproduce media contract evidence
        run: pnpm evidence:media-contract

      - name: Verify evidence hashes
        run: pnpm evidence:check

      - name: Audit production JavaScript dependencies
        run: pnpm audit --prod

      - name: Build
        run: pnpm build

      - name: Verify clean generated state
        run: git diff --exit-code

  pro-layout:
    name: pro-layout (ubuntu)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: 24.15.0
          package-manager-cache: false

      - name: Enable pinned pnpm
        run: corepack enable pnpm

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit actual ProWorkspace layout
        env:
          AIVORA_CHROMIUM: /usr/bin/google-chrome
          AIVORA_AUDIT_OUT: .aijian-dev/pro-layout-audit
        run: pnpm audit:pro-layout

      - name: Upload ProWorkspace layout evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pro-layout-${{ github.sha }}
          path: |
            .aijian-dev/pro-layout-audit/report.json
            .aijian-dev/pro-layout-audit/1280x800-*/*.png
            .aijian-dev/pro-layout-audit/1920x1080-*/*.png
          include-hidden-files: true
          retention-days: 7
